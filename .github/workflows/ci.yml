name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: yarn check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Browsers and their system libraries come preinstalled. Keep the tag equal to @playwright/test in yarn.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The container runs as root, and Firefox refuses a HOME owned by another user.
      HOME: /root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check
        run: yarn run check

  e2e:
    name: end-to-end shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One shard failing does not cancel the others, so every failure is reported in the same run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: End-to-end tests
        # Playwright splits the tests of all three browsers across the shards. The HTML report is written for the upload below.
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: yarn test:e2e --shard=${{ matrix.shard }}/4 --reporter=list,html

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
