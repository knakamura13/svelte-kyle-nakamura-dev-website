name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: yarn check and yarn test:e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Browsers and their system libraries come preinstalled. Keep the tag equal to @playwright/test in yarn.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The container runs as root, and Firefox refuses a HOME owned by another user.
      HOME: /root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check
        run: yarn run check

      - name: End-to-end tests
        run: yarn test:e2e
