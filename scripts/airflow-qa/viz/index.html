<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Airflow visualization QA harness</title>
		<style>
			:root {
				--page: #f7f8f5;
				--ink: #202a24;
				--muted: #5a665f;
				--dock: #f0f2ee;
				--line: #d6dad3;
				--stage: #dde7ee;
			}
			:root[data-theme='dark'] {
				--page: #141a17;
				--ink: #e7ece8;
				--muted: #9aa6a0;
				--dock: #1c2420;
				--line: #34403a;
				--stage: #1d2824;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				display: flex;
				flex-direction: column;
				background: var(--page);
				color: var(--ink);
				font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif;
			}
			#stage {
				position: relative;
				flex: 1 1 auto;
				min-height: 0;
				background: var(--stage);
				overflow: hidden;
			}
			#stage canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
			}
			#labels {
				position: absolute;
				inset: 0;
				pointer-events: none;
			}
			#labels span {
				position: absolute;
				transform: translate(-50%, -50%);
				font-size: 11px;
				font-weight: 600;
				color: var(--ink);
				opacity: 0.8;
				white-space: nowrap;
				text-shadow: 0 0 3px var(--stage), 0 0 3px var(--stage);
			}
			#labels span.compass {
				font-size: 15px;
				opacity: 0.9;
			}
			#dock {
				flex: 0 0 auto;
				background: var(--dock);
				border-top: 1px solid var(--line);
				padding: 12px 16px 14px;
			}
			#status {
				margin-top: 6px;
				font-size: 11px;
				color: var(--muted);
			}
			.legend {
				display: flex;
				flex-wrap: wrap;
				gap: 12px 28px;
				align-items: flex-start;
			}
			.legend .scale {
				flex: 1 1 280px;
				min-width: 0;
			}
			.legend h2 {
				margin: 0 0 6px;
				font-size: 13px;
				font-weight: 650;
			}
			.legend .bar {
				height: 12px;
				border-radius: 3px;
				outline: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
			}
			.legend .ticks {
				position: relative;
				height: 34px;
				margin-top: 1px;
			}
			.legend .tick {
				position: absolute;
				top: 0;
				transform: translateX(-50%);
				text-align: center;
				font-size: 11px;
				color: var(--muted);
				white-space: nowrap;
			}
			.legend .tick::before {
				content: '';
				display: block;
				width: 1px;
				height: 5px;
				margin: 0 auto 2px;
				background: var(--muted);
			}
			.legend .tick.first {
				transform: none;
			}
			.legend .tick.first::before {
				margin-left: 0;
			}
			.legend .tick.last {
				transform: translateX(-100%);
			}
			.legend .tick.last::before {
				margin-right: 0;
			}
			.legend .tick.mid {
				color: var(--ink);
			}
			.legend .wheel {
				position: relative;
				flex: 0 0 auto;
				width: 130px;
				height: 130px;
				margin: 14px;
			}
			.legend .wheel .disc {
				position: absolute;
				inset: 0;
				border-radius: 50%;
				outline: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
			}
			.legend .wheel .ring {
				position: absolute;
				left: 50%;
				top: 50%;
				border: 1px dashed color-mix(in srgb, var(--ink) 55%, transparent);
				border-radius: 50%;
				transform: translate(-50%, -50%);
			}
			.legend .wheel .ringlabel {
				position: absolute;
				left: 50%;
				font-size: 9.5px;
				transform: translate(-50%, -50%);
				color: var(--ink);
				text-shadow: 0 0 2px #fff8;
			}
			.legend .wheel .compass {
				position: absolute;
				font-size: 12px;
				font-weight: 650;
				transform: translate(-50%, -50%);
			}
		</style>
	</head>
	<body>
		<div id="stage">
			<canvas id="c"></canvas>
			<div id="labels"></div>
		</div>
		<div id="dock">
			<div id="legend"></div>
			<div id="status">starting</div>
		</div>
		<script type="module" src="./viz.js"></script>
	</body>
</html>
